<p>Browse ${all.length.toLocaleString()} topics across ${root.kids.length} domains — from pure mathematics to Tamil literature to quantum error correction. Zoom from a whole field down to a single resource.</p>
<div class="big" id="hb">⌕ <span>Search any topic, field or resource…</span><kbd>⌘K</kbd></div>
<div class="stats"><div><b>${root.kids.length}</b><span>Domains</span></div><div><b>${all.length.toLocaleString()}</b><span>Topics mapped</span></div><div><b>${Math.max(...all.map(n=>n.d))}</b><span>Levels deep</span></div><div><b>${SRC.length}</b><span>Live gateways</span></div></div></section>
${r.length?`<div class="sh"><span>Recently visited</span></div><div class="chips">${r.map(n=>`<a class="chip" href="#${n.id}">${E(n.name)}</a>`).join('')}</div>`:''}
<div class="sh"><span>Domains</span><span>${root.kids.length} entry points</span></div><div class="grid">${root.kids.map(card).join('')}</div></div>`}

function page(n){const a=anc(n),dom=a[0],k=n.kids.length,sib=n.p.kids.filter(x=>x!==n).slice(0,18);addRec(n.id);
app.innerHTML=`<div class="wrap"><div class="pg"><nav class="side">${tree(root.kids,a)}</nav><article>
<div class="cr"><a href="#">Atlas</a>${a.map((x,i)=>'<span>/</span>'+(i<a.length-1?`<a href="#${x.id}">${E(x.name)}</a>`:`<span>${E(x.name)}</span>`)).join('')}</div>
<h1>${E(n.name)}</h1><div class="meta">Domain ${pad(dom.id)} · ${LV[n.d]} · ${k?k+' sub-topics · '+tot(n)+' topics in total':'Topic'}</div>
${k?`<div class="sh"><span>Browse</span>${k>10?`<input class="fi" id="fi" placeholder="Filter ${k} topics…">`:''}</div><div class="grid" id="gr">${n.kids.map(card).join('')}</div>`:''}
${n.d>1?gw(n,+dom.id):''}
${sib.length?`<div class="sh"><span>${n.d==1?'Other domains':'Also in '+E(n.p.name)}</span></div><div class="chips">${sib.map(x=>`<a class="chip" href="#${x.id}">${E(x.name)}</a>`).join('')}</div>`:''}
</article></div></div>`}

function go(){const n=find(location.hash.slice(1))||root;shut();if(n===root){home();document.title='Atlas — A Global Knowledge Directory'}else{page(n);document.title=n.name+' · Atlas'}scrollTo(0,0)}
addEventListener('hashchange',go);

app.addEventListener('click',e=>{if(e.target.closest('#hb'))return open();const c=e.target.closest('.chip[data-t]');if(c){document.querySelectorAll('#ch .chip').forEach(x=>x.classList.toggle('on',x===c));document.querySelectorAll('.gw a').forEach(x=>x.hidden=!!c.dataset.t&&x.dataset.t!=c.dataset.t)}});
app.addEventListener('input',e=>{if(e.target.id=='fi'){const v=e.target.value.toLowerCase();[...$('#gr').children].forEach(c=>c.hidden=!c.textContent.toLowerCase().includes(v))}});

const pal=$('#pal'),pi=$('#pi'),pr=$('#pr');let sel=0,rs=[];
function open(){pal.classList.add('open');pi.value='';list();pi.focus()}
function shut(){pal.classList.remove('open')}
function list(){const q=pi.value.toLowerCase().trim();sel=0;
rs=q?all.map(n=>[n,n.lc.startsWith(q)?0:n.lc.includes(' '+q)?1:n.lc.includes(q)?2:n.pl.includes(q)?3:9]).filter(x=>x[1]<9).sort((a,b)=>a[1]-b[1]||a[0].d-b[0].d).slice(0,40).map(x=>x[0]):root.kids;
pr.innerHTML=rs.length?rs.map((n,i)=>`<a href="#${n.id}" class="${i?'':'on'}"><span>${E(n.name)}</span><i>${E(n.p.path||'Domain '+pad(n.id))}</i></a>`).join(''):'<p class="note" style="padding:14px">Nothing matches that yet.</p>'}
function mark(){[...pr.children].forEach((c,i)=>{c.classList.toggle('on',i==sel);if(i==sel)c.scrollIntoView({block:'nearest'})})}
pi.addEventListener('input',list);
pi.addEventListener('keydown',e=>{if(e.key=='ArrowDown'){sel=Math.min(sel+1,rs.length-1);mark();e.preventDefault()}else if(e.key=='ArrowUp'){sel=Math.max(sel-1,0);mark();e.preventDefault()}else if(e.key=='Enter'&&rs[sel]){location.hash=rs[sel].id;shut()}});
pal.addEventListener('click',e=>{if(e.target===pal||e.target.closest('.res a'))shut()});
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key=='k'){e.preventDefault();open()}else if(e.key=='Escape')shut();else if(e.key=='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();open()}});
$('#sb').onclick=open;
$('#rn').onclick=()=>{location.hash=all[Math.random()*all.length|0].id};
try{const t=localStorage.getItem('atlas-theme');if(t)R.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const d=(R.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';R.dataset.theme=d;try{localStorage.setItem('atlas-theme',d)}catch(e){}};
pi.placeholder='Search '+all.length.toLocaleString()+' topics…';
go();
</script></body></html>
